spring:
  application:
    name: url-shortener
  profiles:
    default: local          # no profile chosen → use application-local.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      port: 6379
      timeout: 100ms
      connect-timeout: 200ms
  cloud:
    aws:
      region:
        static: us-west-2

server:
  forward-headers-strategy: native
  tomcat:
    mbeanregistry:
      enabled: true

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

shortener:
  base-url: http://localhost:8080
  code:
    multiplier: 1580030173
  analytics:
    queue: click-events
  worker:
    enabled: true