spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5433/shortener
    username: shortener
    password: shortener
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 100ms
      connect-timeout: 200ms
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: local
        secret-key: local
      sqs:
        endpoint: http://localhost:9324

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
shortener:
  base-url: http://localhost:8080
  code:
    multiplier: 1580030173
  analytics:
    queue: click-events
  worker:
    enabled: true