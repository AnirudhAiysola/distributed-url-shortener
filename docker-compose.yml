services:
  postgres:
    image: postgres:17-alpine
    container_name: shortener-postgres
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: shortener-redis
    ports:
      - "6379:6379"
  elasticmq:
    image: softwaremill/elasticmq-native
    container_name: shortener-sqs
    ports:
      - "9324:9324"   # SQS API
      - "9325:9325"   # web UI to browse queues
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf
  prometheus:
    image: prom/prometheus
    container_name: shortener-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana
    container_name: shortener-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
volumes:
  pgdata: